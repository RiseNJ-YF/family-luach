<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Family Luach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2323578C'/%3E%3Cpath d='M32 20v12M17 32h30M17 32v9M47 32v9' stroke='%23fff' stroke-width='4.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='15' r='7.5' fill='%23fff'/%3E%3Ccircle cx='17' cy='47' r='7.5' fill='%23F2C14E'/%3E%3Ccircle cx='47' cy='47' r='7.5' fill='%23F2C14E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#23578C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap">
<style id="app-style">
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F3EF;--surface:#FFFFFF;--surface-2:#E7EBE5;--ink:#19222D;--ink-2:#46515E;--ink-3:#77818D;
  --line:#D3D9D0;--line-2:#BCC4B9;--accent:#23578C;--accent-ink:#FFFFFF;
  --c-birthday:#23578C;--c-hbirthday:#6A4899;--c-anniversary:#A2741A;--c-yahrzeit:#515B67;--c-other:#9B4459;--c-holiday:#3D7853;
  --shadow:0 12px 40px rgba(25,34,45,.18);--scrim:rgba(25,34,45,.32);
  --display:"Frank Ruhl Libre","Times New Roman",Georgia,serif;
  --sans:"Assistant","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151B;--surface:#19202A;--surface-2:#222B36;--ink:#E6EAEE;--ink-2:#B1BAC5;--ink-3:#838D99;
    --line:#2D3743;--line-2:#3C4855;--accent:#8DB8E4;--accent-ink:#0D1620;
    --c-birthday:#8DB8E4;--c-hbirthday:#BBA0E6;--c-anniversary:#DDB45E;--c-yahrzeit:#A9B2BE;--c-other:#E394A7;--c-holiday:#82C69C;
    --shadow:0 12px 40px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B;--surface:#19202A;--surface-2:#222B36;--ink:#E6EAEE;--ink-2:#B1BAC5;--ink-3:#838D99;
  --line:#2D3743;--line-2:#3C4855;--accent:#8DB8E4;--accent-ink:#0D1620;
  --c-birthday:#8DB8E4;--c-hbirthday:#BBA0E6;--c-anniversary:#DDB45E;--c-yahrzeit:#A9B2BE;--c-other:#E394A7;--c-holiday:#82C69C;
  --shadow:0 12px 40px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.he{font-family:var(--sans);unicode-bidi:isolate}
.he-big,.day-panel>.he,.dheb,.pcard .ph,.udate .he{text-align:left}
.num{font-variant-numeric:tabular-nums}
.hn{font-family:var(--display);unicode-bidi:isolate;font-size:1.06em}
.nm{font-weight:700}.np{font-weight:400}
.tcard .tn.he{font-family:var(--display);font-size:15px}
.dh h2 .hn,.pcard .pn .hn{font-size:1em}

.wrap{margin:0 auto;padding-inline:clamp(20px,2.5vw,56px);padding-block:0 96px}
@media (max-width:560px){.wrap,.wrap.wide{padding-inline:16px}}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-block:28px 18px}
.brand h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,4.4vw,42px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.today-line{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;color:var(--ink-2);font-size:15px}
.today-line .he{font-family:var(--display);font-size:17px;color:var(--ink)}
.today-line .sep{color:var(--line-2)}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mode-pill{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:4px 10px}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:#B3261E;border-color:color-mix(in srgb,#B3261E 45%,transparent);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:8px;font-size:22px;line-height:1;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}

.tabs-row{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px 12px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:15px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs-row .btn{margin-bottom:6px}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--line-2);border-radius:10px;padding:12px 16px;margin-bottom:20px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.panel h3{margin:0 0 6px;font-family:var(--display);font-weight:500;font-size:20px}
.panel p{margin:6px 0;color:var(--ink-2);max-width:68ch}
.panel ol{margin:8px 0;padding-left:20px;color:var(--ink-2)}
.panel .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-right:4px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 11px 4px 9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--c,var(--ink-3))}
.chip[aria-pressed="false"]{opacity:.62}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.k-birthday{--c:var(--c-birthday)}.k-hbirthday{--c:var(--c-hbirthday)}.k-anniversary{--c:var(--c-anniversary)}.k-yahrzeit{--c:var(--c-yahrzeit)}.k-other{--c:var(--c-other)}.k-holiday{--c:var(--c-holiday)}.k-cal{--c:var(--ink-3)}
.hmark{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid currentColor;font-size:10px;font-weight:700;line-height:1;flex:none;font-family:var(--sans)}

/* upcoming */
.up-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
@media (max-width:900px){.up-grid{grid-template-columns:1fr}}
.today-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.today-card h2{font-family:var(--display);font-weight:500;font-size:26px;margin:4px 0 2px}
.today-card .he-big{font-family:var(--display);font-size:22px;color:var(--ink-2)}
.today-card .none{color:var(--ink-3);margin-top:10px}
.month-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.month-h h3{margin:0;font-family:var(--display);font-weight:500;font-size:21px}
.month-h .he{color:var(--ink-3);font-size:15px}
.ulist{list-style:none;margin:0;padding:0}
.urow{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);border-radius:6px}
.urow.compact{grid-template-columns:minmax(0,1fr);padding:10px 4px}
.urow.click{cursor:pointer}
.urow.click:hover{background:var(--surface)}
.udate{display:flex;flex-direction:column;line-height:1.15}
.udate b{font-family:var(--display);font-weight:500;font-size:24px}
.udate .wd{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.udate .he{font-size:13px;color:var(--ink-2);margin-top:2px}
.ubody{min-width:0;display:flex;gap:10px;align-items:flex-start}
.ubar{width:3px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.utitle{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.utitle .hmark{color:var(--c)}
.usub{color:var(--ink-2);font-size:14px}
.uwhen{font-size:13px;color:var(--ink-3);white-space:nowrap;text-align:right}
.uwhen.soon{color:var(--accent);font-weight:700}
.more-row{margin-top:18px}
.side h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.side .block{margin-bottom:26px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:500;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-2)}
.legend{display:grid;gap:8px;font-size:14px;color:var(--ink-2)}
.legend div{display:flex;gap:8px;align-items:center}
.empty{padding:48px 20px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-2);border-radius:14px}
.empty h3{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 6px;color:var(--ink)}

/* calendar */
.cal-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title h2{margin:0;font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1}
.cal-title .sub{color:var(--ink-2);font-size:15px;margin-top:2px}
.cal-title .sub .he{font-family:var(--display);font-size:16px}
.cal-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:980px){.cal-layout{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}
.wdh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-3);padding:8px 8px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.cell{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);min-height:108px;padding:6px 6px 8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.cell.out{background:var(--bg)}
.cell.out .cd{color:var(--ink-3)}
.cell.sat{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.cell.out.sat{background:var(--bg)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cd{display:flex;justify-content:space-between;align-items:baseline;gap:4px;width:100%}
.cd .p{font-family:var(--display);font-size:18px;font-weight:500;line-height:1}
.cell.today .cd .p{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:26px;height:26px;display:inline-grid;place-items:center;padding:0 5px;font-size:16px}
.cd .s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .s.he{font-size:13px}
.cd .s.mstart{color:var(--ink);font-weight:600}
.cev{display:flex;flex-direction:column;gap:2px;width:100%;min-width:0}
.ev{font-size:12px;line-height:1.25;padding:2px 5px;border-radius:4px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.ev .hmark{width:13px;height:13px;font-size:8px;color:var(--c)}
.ev.holiday{background:transparent;color:var(--c-holiday);font-weight:600;padding-left:0}
.ev-more{font-size:11px;color:var(--ink-3);padding-left:5px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
@media (max-width:640px){
  .cell{min-height:62px;padding:4px}
  .cev{display:none}.dots{display:flex}
  .cd{flex-direction:column;align-items:flex-start;gap:1px}
  .cd .p{font-size:16px}
  .cd .s{font-size:10px}.cd .s.he{font-size:11px}
  .wdh{padding:6px 4px;font-size:10px;letter-spacing:.02em}
}
.day-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.day-panel h3{margin:0;font-family:var(--display);font-weight:500;font-size:21px}
.day-panel .he{font-family:var(--display);font-size:17px;color:var(--ink-2)}
.day-panel .ulist{margin-top:12px}
.note{font-size:13px;color:var(--ink-3)}

/* year */
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ymonth{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px}
.ymonth h3{margin:0;font-family:var(--display);font-weight:500;font-size:19px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ymonth h3 .he{font-family:var(--display);font-size:15px;color:var(--ink-2)}
.ysub{font-size:12px;color:var(--ink-3);margin-top:-4px}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mini .mh{font-size:10px;color:var(--ink-3);text-align:center;font-weight:700;padding-bottom:2px}
.mini button{border:0;background:transparent;border-radius:6px;padding:3px 0 2px;font-size:12px;text-align:center;line-height:1.1;min-width:0}
.mini button:hover{background:var(--surface-2)}
.mini button.has{background:color-mix(in srgb,var(--c) 20%,transparent);font-weight:700}
.mini button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.mini button .hs{display:block;font-size:9px;color:var(--ink-3);font-weight:400}
.ylist{list-style:none;margin:0;padding:6px 0 0;border-top:1px solid var(--line);display:grid;gap:3px;font-size:13px}
.ylist li{display:flex;gap:6px;align-items:baseline;cursor:pointer}
.ylist li:hover .yt{text-decoration:underline}
.ylist b{font-variant-numeric:tabular-nums;min-width:22px;color:var(--ink-2);font-weight:600}
.ylist .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}
.ylist .none{color:var(--ink-3);cursor:default}

/* tree */
.tree-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tree-bar label{font-size:13px;color:var(--ink-2);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14px;max-width:100%}
/* Every tab uses the full width of the window; text keeps its normal size (browser zoom makes it bigger). */
.tree-bar label{max-width:100%;min-width:0}.tree-bar .sel{max-width:100%;min-width:0;text-overflow:ellipsis}
.zoom-pct{cursor:default;min-width:56px;justify-content:center}
.tree-wrap.panning{cursor:grabbing}
.tree-wrap{cursor:grab;touch-action:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 16px 36px;background-image:radial-gradient(color-mix(in srgb,var(--ink) 10%,transparent) 1px,transparent 1px);background-size:22px 22px}
.ftree{position:relative;margin-inline:auto}
.ftree .fl-h{position:absolute;height:0;border-top:1.5px solid var(--line-2)}
.ftree .fl-v{position:absolute;width:0;border-left:1.5px solid var(--line-2)}
.ftree .fl-el{position:absolute;box-sizing:border-box;border:0 solid var(--line-2)}
.ftree .fl-el.tl{border-top-width:1.5px;border-left-width:1.5px}
.ftree .fl-el.tr{border-top-width:1.5px;border-right-width:1.5px}
.ftree .fl-el.bl{border-left-width:1.5px;border-bottom-width:1.5px}
.ftree .fl-el.br{border-right-width:1.5px;border-bottom-width:1.5px}
.ftree .fl-h.mar{border-top:2px solid var(--c-anniversary)}
.ftree .fl-h.mar.ended{border-top:2px solid var(--ink-3)}
.ftree .fl-h.ms1{border-top-style:dashed!important}.ftree .fl-v.ms1{border-left-style:dashed!important}.ftree .fl-el.ms1{border-style:dashed!important}
.ftree .fl-h.ms2{border-top-style:dotted!important}.ftree .fl-v.ms2{border-left-style:dotted!important}.ftree .fl-el.ms2{border-style:dotted!important}
.ftree .fl-h.ms3{border-top-style:double!important}.ftree .fl-v.ms3{border-left-style:double!important}.ftree .fl-el.ms3{border-style:double!important}
.ftree .fl-h.ms3{border-top-width:4px!important}
.ftree .fl-v.ms3{border-left-width:4px!important}
.fring{position:absolute;transform:translate(-50%,-50%);background:var(--surface);color:var(--c-anniversary);font-size:15px;line-height:1;padding:2px 4px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.fring.ended{color:var(--ink-3)}
.fring small{font-family:var(--sans);font-size:10px;color:var(--ink-3);font-weight:700}
.fcell{position:absolute}
.tchip{position:absolute;transform:translateX(-50%);border:1px solid var(--line-2);background:var(--surface);border-radius:999px;font-size:13px;font-weight:600;padding:3px 11px;color:var(--accent);white-space:nowrap;cursor:pointer;line-height:1.3}
.tchip:hover{border-color:var(--accent)}
.tchip.open{padding:0;width:24px;height:24px;line-height:21px;font-size:16px;color:var(--ink-2)}
.otree{position:relative;width:max-content;margin:0}
.otree.rtl{margin-left:auto}
.otree .orow{position:relative;display:flex;align-items:stretch;padding-block:6px}
.otree.rtl .orow{flex-direction:row-reverse}
.otree .og{position:absolute;width:0;border-left:1.5px solid var(--line-2)}
.otree .oh{position:absolute;top:50%;height:0;border-top:1.5px solid var(--line-2)}
.otree .oring{align-self:center;color:var(--c-anniversary);width:30px;flex:none;text-align:center;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.otree .oring small{font-size:10px;color:var(--ink-3);font-weight:600}
.otree .oc{position:absolute;box-sizing:border-box;border:0 solid var(--line-2)}
.otree .ob{position:absolute;bottom:0;height:0;border-top:1.5px solid var(--line-2)}
.otree .olabel{align-self:center;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-2);border-radius:999px;padding:3px 11px;white-space:nowrap}
.otree .tcard{width:214px;height:auto;min-height:78px;padding:6px 10px}
.tcell{position:relative;display:flex;flex-direction:column;align-items:center}
.tcard{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 9px 9px;width:172px;height:124px;overflow:hidden;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1px;line-height:1.2}
.tcard>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tcard>span.tn,.tcard>span.tl{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.15}
.tcard .tn.long{font-size:13.5px}.tcard .tn.xlong{font-size:12px}
.tcard:hover{border-color:var(--accent);box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 18%,transparent)}
.tcard .tn{font-family:var(--display);font-weight:500;font-size:16px}
.tcard .tl{font-size:12px;color:var(--ink-3)}
.tcard .td{font-size:12px;color:var(--ink-2)}
.tcard .th{font-size:13px;color:var(--ink-2)}
.tcard .tk{font-size:11px;color:var(--ink-3);margin-top:2px}
.tcard.dec{background:var(--bg);border-style:dashed}
.tcard.root{border-color:var(--accent);border-width:1.5px}
.tcard.m{border-top:3px solid var(--c-birthday)}
.tcard.f{border-top:3px solid var(--c-other)}
.zl{font-family:var(--display);font-size:.8em;color:var(--ink-3);font-weight:400}
.upbtn{position:absolute;top:-19px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--ink-2);white-space:nowrap;font-weight:600}
.upbtn:hover{color:var(--accent);border-color:var(--accent)}

/* people */
.people-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.search{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 12px;min-width:0;width:280px;max-width:100%}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.pcard:hover{border-color:var(--line-2);box-shadow:0 2px 12px rgba(0,0,0,.05)}
.pcard .pn{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.15}
.pcard .ph{color:var(--ink-2);font-size:15px;font-family:var(--display)}
.pcard .pl{font-size:14px;color:var(--ink-2)}
.pcard .kids{display:flex;gap:14px;margin-top:4px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pcard .kids b{font-family:var(--display);font-size:20px;font-weight:500;color:var(--ink);margin-right:3px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1}
.dh .dheb{margin:4px 0 0;font-family:var(--display);font-size:20px;color:var(--ink-2)}
.dh .rel{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.dbody{flex:1;overflow:auto;padding:16px 22px 24px;display:flex;flex-direction:column;gap:22px}
.dfoot{border-top:1px solid var(--line);padding:12px 22px;display:flex;flex-wrap:wrap;gap:8px}
.dsec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.facts{display:grid;gap:0;border-top:1px solid var(--line)}
.fact{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.fact .fl{color:var(--ink-3);font-size:14px}
.fact .fv{font-weight:600}
.fact .fv .alt{display:block;font-weight:400;color:var(--ink-2);font-size:14px}
.fact .fv .alt .he{font-family:var(--display);font-size:15px}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.count{flex:1 1 90px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.count b{display:block;font-family:var(--display);font-size:28px;font-weight:500;line-height:1}
.count span{font-size:13px;color:var(--ink-2)}
.rel-list{display:grid;gap:12px}
.rel-list .rl{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:start}
.rel-list .rl>span{color:var(--ink-3);font-size:14px;padding-top:3px}
.rel-list .rl .btn{margin-top:6px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.pchip:hover{border-color:var(--accent);color:var(--accent)}
.pchip small{font-weight:400;color:var(--ink-3)}
.dnote{white-space:pre-wrap;color:var(--ink-2);margin:0}
.copyable{user-select:all}

/* form */
.form{display:flex;flex-direction:column;gap:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.fgrid{grid-template-columns:1fr}}
@media (max-width:640px){
  .btn,.btn.sm{min-height:40px;padding-block:8px}
  .seg button{min-height:38px}
  .chip{min-height:36px}
  button.linkbtn{padding:10px 4px}
  .inp,.sel,input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px}
}
.navgrp{display:inline-flex;gap:6px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.flab{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.inp.he{font-family:var(--display);font-size:16px}
textarea.inp{min-height:70px;resize:vertical}
.check{display:inline-flex;gap:7px;align-items:center;font-size:14px;color:var(--ink-2)}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.gender{display:flex;gap:8px}
.gender label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-weight:600;cursor:pointer;background:var(--bg)}
.gender label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--ink)}
.gender input{accent-color:var(--accent)}
.hebprev{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.hebprev .he{font-family:var(--display);font-size:20px;color:var(--ink)}
.hebprev .note{font-size:12px}
.fsec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.fsec h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.dfield{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.drow .inp[type="date"]{width:auto;flex:1 1 150px}
.hprev{font-size:14px;color:var(--ink-2);min-height:1.2em}
.hprev .he{font-family:var(--display);font-size:15px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.hhelp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.hhelp .inp{width:auto;padding:6px 8px}
.hhelp input.inp{width:84px}
.subrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.subrow .inp{background:var(--surface)}
.subrow-top{display:flex;gap:8px;align-items:center}
.subrow-top .inp{flex:1}
.subrow-top .ordl{font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,#B3261E 8%,transparent);border:1px solid color-mix(in srgb,#B3261E 35%,transparent);border-radius:10px;padding:10px 12px;font-size:14px}
.err{color:#B3261E;font-size:13px;font-weight:600}

/* save bar + toast */
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px);flex-wrap:wrap}
.savebar span{font-size:14px}
.savebar .btn{border-color:transparent}
.savebar .btn.ghost{color:var(--bg)}
.savebar .btn.ghost:hover{background:rgba(127,127,127,.2)}
.gate{max-width:460px;margin:12vh auto 24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px}
.gate h1{font-family:var(--display);font-weight:500;font-size:30px;margin:0 0 6px;line-height:1.1}
.gate p{color:var(--ink-2);margin:0 0 14px}
.webfoot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;margin-top:40px;font-size:13px;color:var(--ink-3)}
.webfoot .sep{color:var(--line-2)}
.gate .step{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.gate .step ol{margin:0;padding-left:18px}
.gate:has(#setup){max-width:560px}
.acct-list{display:grid;gap:0;border-top:1px solid var(--line);margin:8px 0}
.acct{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.acct-who{display:flex;gap:8px;align-items:center}
.acct-do{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acct-do .inp{width:170px}
.role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:2px 8px;border:1px solid var(--line-2);color:var(--ink-2)}
.role.editor{border-color:var(--accent);color:var(--accent)}
.acct-add .inp{max-width:200px}
.panel h4.subh{margin:18px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:60;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:10px 16px;box-shadow:var(--shadow);font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slidein .22s ease-out}
  @keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
}
</style>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return (p||'p')+Math.random().toString(36).slice(2,9);}

/* ---------- Hebrew calendar (Dershowitz–Reingold arithmetic) ---------- */
var elapsedMemo={};
var H={
  leap:function(y){return ((7*y+1)%19)<7;},
  months:function(y){return H.leap(y)?13:12;},
  elapsed:function(y){
    if(elapsedMemo[y]!=null) return elapsedMemo[y];
    var m=235*Math.floor((y-1)/19)+12*((y-1)%19)+Math.floor((7*((y-1)%19)+1)/19);
    var pE=204+793*(m%1080);
    var hE=5+12*m+793*Math.floor(m/1080)+Math.floor(pE/1080);
    var day=1+29*m+Math.floor(hE/24);
    var parts=1080*(hE%24)+pE%1080;
    if(parts>=19440||(day%7===2&&parts>=9924&&!H.leap(y))||(day%7===1&&parts>=16789&&H.leap(y-1))) day++;
    if(day%7===0||day%7===3||day%7===5) day++;
    elapsedMemo[y]=day; return day;
  },
  daysInYear:function(y){return H.elapsed(y+1)-H.elapsed(y);},
  longCheshvan:function(y){return H.daysInYear(y)%10===5;},
  shortKislev:function(y){return H.daysInYear(y)%10===3;},
  monthLen:function(m,y){
    if(m===2||m===4||m===6||m===10||m===13) return 29;
    if(m===12&&!H.leap(y)) return 29;
    if(m===8&&!H.longCheshvan(y)) return 29;
    if(m===9&&H.shortKislev(y)) return 29;
    return 30;
  },
  toAbs:function(y,m,d){
    var t=d,i;
    if(m<7){for(i=7;i<=H.months(y);i++) t+=H.monthLen(i,y); for(i=1;i<m;i++) t+=H.monthLen(i,y);}
    else {for(i=7;i<m;i++) t+=H.monthLen(i,y);}
    return t+H.elapsed(y)-1373429;
  },
  fromAbs:function(a){
    var y=Math.floor((a+1373429)/366);
    while(a>=H.toAbs(y+1,7,1)) y++;
    var m=a<H.toAbs(y,1,1)?7:1;
    while(a>H.toAbs(y,m,H.monthLen(m,y))) m++;
    return {y:y,m:m,d:a-H.toAbs(y,m,1)+1};
  }
};
/* Birthdays & anniversaries: Adar of a plain year / Adar II follow to the last Adar of the target year. */
function hebAnniv(h,ty){
  var m=h.m;
  if(m===H.months(h.y)) m=H.months(ty);
  return H.toAbs(ty,m,1)+h.d-1;
}
/* Yahrzeit rules for 30 Cheshvan, 30 Kislev, Adar II and 30 Adar I.
   Family custom: a passing in Adar of a regular year is observed in Adar II in a leap year. */
function yahrzeit(h,ty){
  if(h.m===8&&h.d===30&&!H.longCheshvan(h.y+1)) return H.toAbs(ty,9,1)-1;
  if(h.m===9&&h.d===30&&H.shortKislev(h.y+1)) return H.toAbs(ty,10,1)-1;
  if(h.m===13) return H.toAbs(ty,H.months(ty),1)+h.d-1;
  if(h.m===12&&!H.leap(h.y)) return H.toAbs(ty,H.months(ty),1)+h.d-1;
  if(h.m===12&&h.d===30&&!H.leap(ty)) return H.toAbs(ty,11,30);
  return H.toAbs(ty,h.m,1)+h.d-1;
}
var HM_EN=[null,'Nisan','Iyar','Sivan','Tammuz','Av','Elul','Tishrei','Cheshvan','Kislev','Tevet','Shevat','Adar','Adar II'];
var HM_HE=[null,'ניסן','אייר','סיון','תמוז','אב','אלול','תשרי','חשון','כסלו','טבת','שבט','אדר','אדר ב׳'];
var HM_ORDER=[7,8,9,10,11,12,13,1,2,3,4,5,6];
function hmName(m,y,he){if(m===12&&H.leap(y)) return he?'אדר א׳':'Adar I'; return (he?HM_HE:HM_EN)[m];}
function gem(n){
  var O=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],T=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],C=['','ק','ר','ש','ת'];
  var s='',h=Math.floor(n/100);
  while(h>=4){s+='ת';h-=4;}
  s+=C[h];
  var r=n%100;
  if(r===15) s+='טו'; else if(r===16) s+='טז'; else s+=T[Math.floor(r/10)]+O[r%10];
  return s.length===1?s+'׳':s.slice(0,-1)+'״'+s.slice(-1);
}
function fmtH(h,yr){return h.d+' '+hmName(h.m,h.y)+(yr===false?'':' '+h.y);}
function fmtHe(h,yr){return gem(h.d)+' '+hmName(h.m,h.y,true)+(yr===false?'':' '+gem(h.y%1000));}
function heSpan(h,yr){return '<span class="he" dir="rtl" lang="he">'+esc(fmtHe(h,yr))+'</span>';}

/* ---------- Gregorian helpers (day numbers are R.D.: 1 = Jan 1, year 1) ---------- */
var GM=['January','February','March','April','May','June','July','August','September','October','November','December'];
var GMS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Shabbat'];
var WDS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var WD1=['S','M','T','W','T','F','Sh'];
function absFromG(y,m,d){var t=new Date(0);t.setUTCFullYear(y,m-1,d);return Math.round(t.getTime()/864e5)+719163;}
function gFromAbs(a){var t=new Date((a-719163)*864e5);return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()};}
function dow(a){return ((a%7)+7)%7;}
function parseISO(s){var r=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return r?{y:+r[1],m:+r[2],d:+r[3]}:null;}
function isoAbs(s){var p=parseISO(s);return p?absFromG(p.y,p.m,p.d):null;}
function pad(n,l){return String(n).padStart(l||2,'0');}
function isoFromAbs(a){var g=gFromAbs(a);return pad(g.y,4)+'-'+pad(g.m)+'-'+pad(g.d);}
function gLeap(y){return (y%4===0&&y%100!==0)||y%400===0;}
function gAnniv(p,y){var d=p.d;if(p.m===2&&d===29&&!gLeap(y)) d=28;return absFromG(y,p.m,d);}
function fmtG(a,o){o=o||{};var g=gFromAbs(a);return (o.wd?WDS[dow(a)]+', ':'')+(o.long?GM:GMS)[g.m-1]+' '+g.d+(o.yr===false?'':', '+g.y);}
function fmtMD(p){return GMS[p.m-1]+' '+p.d;}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function hebOf(iso,sunset){var a=isoAbs(iso);return a==null?null:H.fromAbs(a+(sunset?1:0));}
var NOW=new Date();
var TODAY=absFromG(NOW.getFullYear(),NOW.getMonth()+1,NOW.getDate());
function rel(a){var n=a-TODAY;if(n===0) return 'Today';if(n===1) return 'Tomorrow';if(n===-1) return 'Yesterday';return n>0?'in '+n+' days':Math.abs(n)+' days ago';}

/* ---------- Data ---------- */
function normPerson(p){
  p=p||{};
  var gender=p.gender==='m'||p.gender==='f'?p.gender:'';
  var hebFirst=p.hebFirst,hebLast=p.hebLast,fatherHeb=p.fatherHeb,motherHeb=p.motherHeb;
  if(hebFirst==null&&p.hebrew){ /* migrate the old single "Hebrew name" field, e.g. "דוד בן יצחק" */
    var mm=/^(.*?)\s+(בן|בת)\s+(.+)$/.exec(String(p.hebrew).trim());
    if(mm){hebFirst=mm[1];fatherHeb=fatherHeb||mm[3];if(!gender) gender=mm[2]==='בן'?'m':'f';}
    else hebFirst=String(p.hebrew).trim();
  }
  return {id:String(p.id||uid('p')),first:String(p.first||''),last:String(p.last||''),gender:gender,
    hebFirst:String(hebFirst||''),hebLast:String(hebLast||''),fatherHeb:String(fatherHeb||''),motherHeb:String(motherHeb||''),
    birth:parseISO(p.birth)?p.birth:'',birthSunset:!!p.birthSunset,birthNoYear:!!p.birthNoYear,hideAge:!!p.hideAge,
    deceased:!!p.deceased,death:parseISO(p.death)?p.death:'',deathSunset:!!p.deathSunset,
    parents:Array.isArray(p.parents)?p.parents.filter(Boolean).map(String).slice(0,2):[],
    others:Array.isArray(p.others)?p.others.map(function(o){return {title:String(o.title||''),date:parseISO(o.date)?o.date:'',sunset:!!o.sunset};}):[],
    phone:String(p.phone||''),email:String(p.email||''),notes:String(p.notes||'')};
}
function normalize(d){
  d=d||{};var m=d.meta||{};
  return {meta:{familyName:String(m.familyName||'Our Family'),example:!!m.example},
    people:Array.isArray(d.people)?d.people.map(normPerson):[],
    marriages:Array.isArray(d.marriages)?d.marriages.filter(function(x){return x&&x.a&&(x.b||x.date||x.nameHe||x.nameEn);}).map(function(x){return {id:String(x.id||uid('m')),a:String(x.a),b:String(x.b||''),date:parseISO(x.date)?x.date:'',sunset:!!x.sunset,divorced:!!x.divorced,nameHe:String(x.nameHe||''),nameEn:String(x.nameEn||'')};}):[]};
}
function readData(){try{return normalize(JSON.parse($('#family-data').textContent));}catch(e){return normalize({});}}
var saved=readData();
var data=JSON.parse(JSON.stringify(saved));
var dirty=false;
var idx;
function reindex(){
  var byId={},kids={},spouses={};
  data.people.forEach(function(p){byId[p.id]=p;kids[p.id]=[];spouses[p.id]=[];});
  data.people.forEach(function(p){p.parents.forEach(function(x){if(kids[x]&&kids[x].indexOf(p.id)<0) kids[x].push(p.id);});});
  var solo={};
  data.marriages.forEach(function(m){
    if(byId[m.a]&&byId[m.b]){spouses[m.a].push({pid:m.b,m:m});spouses[m.b].push({pid:m.a,m:m});}
    else if(byId[m.a]) (solo[m.a]=solo[m.a]||[]).push(m);
  });
  idx={byId:byId,kids:kids,spouses:spouses,solo:solo};
  Object.keys(kids).forEach(function(k){kids[k].sort(byBirth);});
  Object.keys(spouses).forEach(function(k){spouses[k].sort(function(a,b){var x=a.m.date||'9999',y=b.m.date||'9999';return x<y?-1:x>y?1:0;});});
}
function byBirth(a,b){var pa=idx?idx.byId[a]:null,pb=idx?idx.byId[b]:null;var x=pa&&pa.birth||'9999',y=pb&&pb.birth||'9999';return x<y?-1:x>y?1:0;}
function P(id){return idx.byId[id];}
function fullName(p){return p?([p.first,p.last].filter(Boolean).join(' ')||'Unnamed'):'Unknown';}
function firstName(p){return p?(p.first||fullName(p)):'Unknown';}
/* Primary display name: the full Hebrew name when there is one, otherwise the English name. */
function primaryText(p){return p?(hebName(p)||fullName(p)):'Unknown';}
function nameHTML(p,zl){
  if(!p) return 'Unknown';
  var hn=hebName(p),z=zl&&p.deceased;
  return hn?'<bdi class="hn" dir="rtl" lang="he">'+hebPartsHTML(p)+(z?' <span class="np">ז״ל</span>':'')+'</bdi>':esc(fullName(p))+(z?' <span class="zl">ז״ל</span>':'');
}
function kidsOf(id){return (idx.kids[id]||[]).slice();}
/* Marriages whose spouse isn't in the family list (just a wedding date and maybe a typed name). */
function soloOf(id){return (idx.solo&&idx.solo[id])||[];}
function soloName(m){return (m.nameHe||m.nameEn||'').trim();}
function snHTML(n){return /[\u0590-\u05FF]/.test(n)?'<bdi class="hn" dir="rtl" lang="he">'+esc(n)+'</bdi>':esc(n);}
/* Spouses in marriage order (by wedding date; undated last). */
function spousesOf(id){return idx.spouses[id]||[];}
function otherParent(kid,id){var k=P(kid);return k?(k.parents.filter(function(x){return x!==id&&P(x);})[0]||''):'';}
function siblingsOf(id){var p=P(id),out=[];if(!p) return out;p.parents.forEach(function(x){kidsOf(x).forEach(function(k){if(k!==id&&out.indexOf(k)<0) out.push(k);});});return out.sort(byBirth);}
/* Father and mother by gender; a parent with no gender set fills whichever slot is open. */
function parentsOf(p){
  var ps=p.parents.map(P).filter(Boolean),f=null,m=null;
  ps.forEach(function(x){if(x.gender==='m'&&!f) f=x;else if(x.gender==='f'&&!m) m=x;});
  ps.forEach(function(x){if(x===f||x===m) return;if(!f&&x.gender!=='f') f=x;else if(!m&&x.gender!=='m') m=x;});
  return {father:f,mother:m};
}
/* Hebrew name: first בן/בת parent last. Living → mother's name; deceased → father's name.
   Kept as parts so first and last names can be shown bold and the parent's name in normal weight. */
function hebNameParts(o){
  var first=(o.hebFirst||'').trim(),last=(o.hebLast||'').trim(),rel='';
  var par=o.deceased?o.father:o.mother,pn=par&&par.hebFirst?par.hebFirst.trim():'';
  if(!pn) pn=((o.deceased?o.fatherHeb:o.motherHeb)||'').trim();
  if(first&&pn&&o.gender) rel=(o.gender==='m'?'בן ':'בת ')+pn;
  return {first:first,rel:rel,last:last};
}
function hebNameFrom(o){var q=hebNameParts(o);return [q.first,q.rel,q.last].filter(Boolean).join(' ');}
function hebParts(p){var pr=parentsOf(p);return hebNameParts({hebFirst:p.hebFirst,hebLast:p.hebLast,gender:p.gender,deceased:p.deceased,father:pr.father,mother:pr.mother,fatherHeb:p.fatherHeb,motherHeb:p.motherHeb});}
function hebPartsHTML(p){var q=hebParts(p);return [q.first?'<b class="nm">'+esc(q.first)+'</b>':'',q.rel?'<span class="np">'+esc(q.rel)+'</span>':'',q.last?'<b class="nm">'+esc(q.last)+'</b>':''].filter(Boolean).join(' ');}
function hebName(p){if(!p) return '';var pr=parentsOf(p);return hebNameFrom({hebFirst:p.hebFirst,hebLast:p.hebLast,gender:p.gender,deceased:p.deceased,father:pr.father,mother:pr.mother,fatherHeb:p.fatherHeb,motherHeb:p.motherHeb});}
function hebNameZl(p){var n=hebName(p);return n&&p.deceased?n+' ז״ל':n;}
function childWord(p){return p.gender==='m'?'Son':p.gender==='f'?'Daughter':'Child';}
function genCounts(id){
  var counts=[],level=[id],seen={};seen[id]=1;
  for(var g=0;g<8;g++){var next=[];level.forEach(function(x){kidsOf(x).forEach(function(c){if(!seen[c]){seen[c]=1;next.push(c);}});});if(!next.length) break;counts.push(next.length);level=next;}
  return counts;
}
/* A person can ask not to have their age (or birth year) printed in PDFs; the app screen still shows it. */
function noAge(p){return !!(p&&p.hideAge);}
function ageAt(p,atAbs){var b=parseISO(p.birth);if(!b||p.birthNoYear) return null;var t=gFromAbs(atAbs);var n=t.y-b.y;if(t.m<b.m||(t.m===b.m&&t.d<b.d)) n--;return n;}
function nextGreg(iso){var b=parseISO(iso);if(!b) return null;var y=gFromAbs(TODAY).y;var a=gAnniv(b,y);if(a<TODAY) a=gAnniv(b,y+1);return a;}
function nextHeb(h,fn){var ty=H.fromAbs(TODAY).y;var a=fn(h,ty);if(a<TODAY) a=fn(h,ty+1);return a;}

reindex();

/* ---------- Events ---------- */
var HOLIDAYS=[[7,1,'Rosh Hashanah'],[7,10,'Yom Kippur'],[7,15,'Sukkot'],[7,22,'Shemini Atzeret'],[7,23,'Simchat Torah'],[9,25,'Chanukah (1st day)'],[11,15,'Tu BiShvat'],['adar',14,'Purim'],[1,15,'Pesach'],[2,18,'Lag BaOmer'],[3,6,'Shavuot'],[5,9,"Tisha B'Av"]];
var KINDS=[['birthday','Birthdays'],['anniversary','Anniversaries'],['yahrzeit','Yahrzeits'],['other','Other dates'],['holiday','Holidays']];
var prefs=lsGet('fl-prefs',null)||{};
prefs.kinds=Object.assign({birthday:true,anniversary:true,yahrzeit:true,other:true,holiday:true},prefs.kinds||{});
if(prefs.greg==null) prefs.greg=true;
if(prefs.heb==null) prefs.heb=true;
function savePrefs(){lsSet('fl-prefs',prefs);}

function eventsBetween(a0,a1){
  var out=[];
  var gy0=gFromAbs(a0).y,gy1=gFromAbs(a1).y,hy0=H.fromAbs(a0).y,hy1=H.fromAbs(a1).y,y;
  function push(abs,ev){if(abs>=a0&&abs<=a1){ev.abs=abs;out.push(ev);}}
  data.people.forEach(function(p){
    var b=parseISO(p.birth);
    if(b&&!p.deceased){
      for(y=gy0;y<=gy1;y++) if(p.birthNoYear||y>b.y) push(gAnniv(b,y),{kind:'birthday',cal:'greg',pids:[p.id],n:p.birthNoYear?null:y-b.y});
      if(!p.birthNoYear){var hb=hebOf(p.birth,p.birthSunset);for(y=hy0;y<=hy1;y++) if(y>hb.y) push(hebAnniv(hb,y),{kind:'birthday',cal:'heb',pids:[p.id],n:y-hb.y,h:hb});}
    }
    var dd=parseISO(p.death);
    if(p.deceased&&dd){
      for(y=gy0;y<=gy1;y++) if(y>dd.y) push(gAnniv(dd,y),{kind:'yahrzeit',cal:'greg',pids:[p.id],n:y-dd.y});
      var hd=hebOf(p.death,p.deathSunset);for(y=hy0;y<=hy1;y++) if(y>hd.y) push(yahrzeit(hd,y),{kind:'yahrzeit',cal:'heb',pids:[p.id],n:y-hd.y,h:hd});
    }
    p.others.forEach(function(o){
      var od=parseISO(o.date);if(!od) return;
      for(y=gy0;y<=gy1;y++) if(y>od.y) push(gAnniv(od,y),{kind:'other',cal:'greg',pids:[p.id],n:y-od.y,title:o.title});
      var oh=hebOf(o.date,o.sunset);for(y=hy0;y<=hy1;y++) if(y>oh.y) push(hebAnniv(oh,y),{kind:'other',cal:'heb',pids:[p.id],n:y-oh.y,h:oh,title:o.title});
    });
  });
  data.marriages.forEach(function(m){
    var md=parseISO(m.date),A=P(m.a),B=P(m.b);
    if(!md||m.divorced||!A||A.deceased||(B&&B.deceased)) return;
    var pids=B?[m.a,m.b]:[m.a],sn=B?'':soloName(m);
    for(y=gy0;y<=gy1;y++) if(y>md.y) push(gAnniv(md,y),{kind:'anniversary',cal:'greg',pids:pids,sn:sn,n:y-md.y});
    var mh=hebOf(m.date,m.sunset);for(y=hy0;y<=hy1;y++) if(y>mh.y) push(hebAnniv(mh,y),{kind:'anniversary',cal:'heb',pids:pids,sn:sn,n:y-mh.y,h:mh});
  });
  for(y=hy0;y<=hy1;y++) HOLIDAYS.forEach(function(h){
    var m=h[0]==='adar'?H.months(y):h[0];var a=H.toAbs(y,m,h[1]);
    if(h[2]==="Tisha B'Av"&&dow(a)===6) a++;
    push(a,{kind:'holiday',cal:'heb',pids:[],title:h[2]});
  });
  var order={holiday:0,yahrzeit:1,birthday:2,anniversary:3,other:4};
  out.sort(function(x,z){return x.abs-z.abs||order[x.kind]-order[z.kind]||(x.cal===z.cal?0:x.cal==='greg'?-1:1);});
  return out;
}
function visible(e){if(!prefs.kinds[e.kind]) return false;if(e.kind==='holiday') return true;return e.cal==='greg'?prefs.greg:prefs.heb;}
function kkey(e){return e.kind==='birthday'&&e.cal==='heb'?'hbirthday':e.kind;}
function kindClass(e){return 'k-'+kkey(e);}
function names(e){return e.pids.map(function(id){return nameHTML(P(id));}).join(' & ')+(e.sn?' & '+snHTML(e.sn):'');}
function evTitle(e){
  var p=P(e.pids[0]);
  switch(e.kind){
    case 'birthday':return nameHTML(p)+(e.cal==='heb'?' · Hebrew birthday':' · birthday');
    case 'anniversary':return names(e)+(e.cal==='heb'?' · Hebrew anniversary':' · anniversary');
    case 'yahrzeit':return e.cal==='heb'?'Yahrzeit · '+nameHTML(p,true):nameHTML(p,true)+' · English date of passing';
    case 'other':return esc(e.title||'Anniversary')+' · '+nameHTML(p);
    default:return esc(e.title);
  }
}
function evShort(e){
  switch(e.kind){
    case 'birthday':return nameHTML(P(e.pids[0]));
    case 'anniversary':return names(e);
    case 'yahrzeit':return nameHTML(P(e.pids[0]),true);
    case 'other':return e.title?esc(e.title):nameHTML(P(e.pids[0]));
    default:return esc(e.title);
  }
}
function evSub(e,pdf){
  var bits=[];
  if(e.cal==='heb'&&e.h) bits.push(esc(fmtH(e.h,false))+' · '+'<span class="he" dir="rtl" lang="he">'+esc(fmtHe(e.h,false))+'</span>');
  if(e.kind==='birthday'&&e.n!=null&&!(pdf&&noAge(P(e.pids[0])))) bits.push('turns '+e.n);
  if(e.kind==='anniversary') bits.push(ord(e.n)+' anniversary');
  if(e.kind==='yahrzeit') bits.push(e.cal==='heb'?ord(e.n)+' yahrzeit · begins at sundown '+esc(fmtG(e.abs-1,{wd:true,yr:false})):e.n+(e.n===1?' year':' years')+' since passing');
  if(e.kind==='other') bits.push(e.n+(e.n===1?' year':' years'));
  if(e.kind==='holiday') bits.push(esc(fmtH(H.fromAbs(e.abs),false)));
  return bits.join(' · ');
}

/* The tree box fills the rest of the window; in "fit" mode the whole tree is scaled to fit inside it. */
function sizeTree(all){
  var w=$('#tree-wrap'),inner=$('#tree-zoom'),ft=w&&w.querySelector('.ftree');
  if(!w||!inner||!ft) return;
  w.style.height=Math.max(320,window.innerHeight-w.getBoundingClientRect().top-44)+'px';
  if(ui.zoomFit&&ft.classList.contains('otree')){
    /* The outline only needs to fit across; it scrolls down. */
    setZoom(Math.max(0.5,Math.min(1,(w.clientWidth-32)/ft.offsetWidth)));w.scrollTop=0;
    w.scrollLeft=ui.calMode==='heb'?w.scrollWidth:0;
    return;
  }
  if(ui.zoomFit){
    var tw=parseFloat(ft.style.width),th=parseFloat(ft.style.height);
    var z=Math.min((w.clientWidth-32)/tw,(w.clientHeight-64)/th,1.25);
    /* On a phone the whole family would be too small to read: start at a readable size instead,
       with the top of the tree centred. Pinch or drag to see the rest; "Fit" shows everything. */
    var phone=!all&&w.clientWidth<600&&z<0.8;
    setZoom(phone?0.8:Math.max(0.12,z));w.scrollLeft=0;w.scrollTop=0;
    if(phone){
      var rc=w.querySelector('.tcard.root');
      if(rc){
        var top=rc.getBoundingClientRect().top,L=Infinity,R=-Infinity,b=w.getBoundingClientRect();
        $$('.tcard',w).forEach(function(c){var a=c.getBoundingClientRect();if(Math.abs(a.top-top)<2){L=Math.min(L,a.left);R=Math.max(R,a.right);}});
        w.scrollLeft=(L+R)/2-b.left-w.clientWidth/2;
      }
    }
  }
}
function setZoom(z){
  ui.zoom=z;var inner=$('#tree-zoom'),pct=$('#zoom-pct');
  if(inner) inner.style.zoom=z;
  if(pct) pct.textContent=Math.round(z*100)+'%';
}
/* Zoom around a point (the mouse), keeping that spot of the tree under the pointer. */
function zoomAt(clientX,clientY,factor){
  var w=$('#tree-wrap');if(!w) return;
  var r=w.getBoundingClientRect(),z=ui.zoom,nz=Math.max(0.12,Math.min(2.5,z*factor));
  if(nz===z) return;
  var mx=clientX-r.left-w.clientLeft,my=clientY-r.top-w.clientTop;
  var px=(w.scrollLeft+mx-16)/z,py=(w.scrollTop+my-28)/z;
  ui.zoomFit=false;setZoom(nz);
  w.scrollLeft=px*nz+16-mx;w.scrollTop=py*nz+28-my;
}

/* ---------- Tree layout ----------
   Each row is a "marriage chain": the family member, then each husband or wife in the order they
   married (a spouse's own other marriages follow right after that spouse). A later marriage's line runs
   behind the earlier spouses' cards, one line per marriage at its own height and in its own style
   (1st solid, 2nd dashed, 3rd dotted, 4th double). Children drop from their own marriage's label, in the

    else if(right.length&&!left.length&&!mid){var r2=R(right[0]-ax);items.push({t:'el',c:'bl',x:ax,y:y0,w:r2,h:busY+LW-y0,r:r2});xR=ax+r2;}

/* ---------- Tree layout options (all keep oldest → youngest; Hebrew mode mirrors them) ----------

   stack    compact, and brothers/sisters with no spouse or children stand in short columns (read down).
   wrap     compact, and a family with more than 4 children lists them in 2 or more rows (read across).
   branch   compact, and each family's children can be opened or closed.
   outline  an indented list, one generation per step. */

      items.push({t:'h',x:bl,y:busY,w:br-bl+LW});

        var by=ri===0?busY:childY+r.oy-VG/2,cx=r.map(function(x){return g.L+x.ox+x.cx+sh;});
        if(ri>0) items.push({t:'h',x:tx,y:by,w:cx[cx.length-1]-tx+LW});
        cx.forEach(function(c){items.push({t:'v',x:c,y:by,h:childY+r.oy-by});});
        lastBus=by;
      });
      items.push({t:'v',x:tx,y:busY,h:lastBus-busY+LW});
    } else {
      var cxs=g.subs.map(function(x){return g.L+x.ox+x.cx+sh;});
      var left=cxs.filter(function(c){return c<ax-1;}),right=cxs.filter(function(c){return c>ax+1;}),mid=cxs.length-left.length-right.length;

      else if(right.length&&!left.length&&!mid){var r2=R(right[0]-ax);items.push({t:'el',c:'bl',x:ax,y:y0,w:r2,h:busY+LW-y0,r:r2});xR=ax+r2;}
      else items.push({t:'v',x:ax,y:y0,h:(mid&&!left.length&&!right.length?childY:busY+LW)-y0});
      left.forEach(function(cx){var r=R(ax-cx);items.push({t:'el',c:'tl',x:cx,y:busY,w:xL-cx,h:childY-busY,r:r});});

}
/* Outline: one row per family (the person, then each husband or wife in marriage order), children
   indented under them. Each marriage has its own line: it drops from that marriage's ⚭ (or a lone
   parent's card), turns along under the cards and runs down beside the children, in that marriage's
   style (1st solid, 2nd dashed, 3rd dotted, 4th double). Every turn is rounded. */
var OIND=44,OCW=214,ORW=30,ORAD=8;
function outlineRows(root){
  var rows=[],seen={};
  function walk(id,depth,pass,elbow){
    var chain=chainOf(id,seen);chain.forEach(function(x){seen[x]=1;});
    var ip={};chain.forEach(function(x,i){ip[x]=i;});
    var groups=[];
    data.marriages.forEach(function(m){
      if(ip[m.a]==null||ip[m.b]==null) return;
      var g={m:m,kids:kidsOf(m.a).filter(function(k){return !seen[k]&&P(k).parents.indexOf(m.b)>=0;})};
      g.kids.forEach(function(k){seen[k]=1;});groups.push(g);
    });
    chain.forEach(function(x){var ks=kidsOf(x).filter(function(k){return !seen[k];});ks.forEach(function(k){seen[k]=1;});if(ks.length) groups.push({single:x,kids:ks});});
    groups=groups.filter(function(g){return g.kids.length;});
    if(depth>=28) groups=[];
    groups.forEach(function(g){
      g.kids.sort(byBirth);
      g.src=g.single!=null?{card:ip[g.single]}:{ring:Math.max(ip[g.m.a],ip[g.m.b])-1};
      g.st=g.m?marIdx(g.m):0;
    });
    /* Families follow their ⚭ from the start of the row, so no two lines cross. */
    groups.sort(function(p,q){return (p.src.ring!=null?p.src.ring+0.5:p.src.card)-(q.src.ring!=null?q.src.ring+0.5:q.src.card);});
    var rl={};data.marriages.forEach(function(m){if(ip[m.a]!=null&&ip[m.b]!=null) rl[Math.max(ip[m.a],ip[m.b])-1]=marriageOrd(m);});
    var n=groups.length,x0=depth*OIND,sp=n>1?Math.min(8,24/(n-1)):0;
    groups.forEach(function(g,k){g.tx=x0+12+k*sp;});
    rows.push({ids:chain,depth:depth,pass:pass,elbow:elbow,rl:rl,groups:groups.map(function(g){return {src:g.src,st:g.st,tx:g.tx};})});
    var mine=elbow&&!elbow.last?[{x:elbow.x,st:elbow.st}]:[];
    groups.forEach(function(g,j){
      var later=groups.slice(j+1).map(function(q){return {x:q.tx,st:q.st};});
      g.kids.forEach(function(c,ci){walk(c,depth+1,pass.concat(mine,later),{x:g.tx,st:g.st,last:ci===g.kids.length-1});});
    });
  }
  walk(root,0,[],null);
  return rows;
}
function outlineRowHTML(r,root,placed,pdf){
  var heb=ui.calMode==='heb',S=heb?'right':'left',O=heb?'left':'right',x0=r.depth*OIND,n=r.groups.length;
  var pb=n?14+(n-1)*8:6,mid='(50% + '+((6-pb)/2)+'px)';
  var STY=['solid','dashed','dotted','double'];
  /* one line piece: pos = {x, top, bottom, height, width}, sides = which borders, round = which corner */
  function seg(pos,sides,round,st){
    var css=S+':'+pos.x+'px;';
    ['top','bottom','height','width'].forEach(function(k){if(pos[k]!=null) css+=k+':'+pos[k]+';';});
    sides.forEach(function(sd){css+='border-'+sd+'-width:'+(st===3?3:1.5)+'px;';});
    if(round) css+='border-'+round+'-radius:'+ORAD+'px;';
    if(st) css+='border-style:'+STY[st]+';';
    return '<i class="oc" style="'+css+'"></i>';
  }
  var h='<div class="orow" style="padding-'+S+':'+x0+'px;padding-bottom:'+pb+'px">';
  r.pass.forEach(function(l){h+=seg({x:l.x,top:'0',bottom:'0'},[S],null,l.st);});
  if(r.elbow){
    var e=r.elbow;
    if(!e.last) h+=seg({x:e.x,top:'0',bottom:'0'},[S],null,e.st);
    h+=seg({x:e.x,top:'0',height:'calc'+mid,width:(x0-e.x+1)+'px'},[S,'bottom'],'bottom-'+S,e.st);
  }
  r.groups.forEach(function(g,k){
    var sx=g.src.ring!=null?x0+(g.src.ring+1)*OCW+g.src.ring*ORW+ORW/2:x0+g.src.card*(OCW+ORW)+OCW/2;
    var bk=8+(n-1-k)*8,labeled=g.src.ring!=null&&r.rl[g.src.ring];
    var top=g.src.ring!=null?'calc('+mid.slice(1,-1)+' + '+(labeled?19:11)+'px)':'calc(100% - '+pb+'px)';
    /* down from the ⚭, round the corner, along under the cards … */
    h+=seg({x:g.tx+ORAD,top:top,bottom:bk+'px',width:(sx-g.tx-ORAD+1.5)+'px'},[O,'bottom'],'bottom-'+O,g.st);

    h+=seg({x:g.tx,bottom:'0',height:(bk+1.5)+'px',width:(ORAD+1)+'px'},[S,'top'],'top-'+S,g.st);

    var ring=i<r.ids.length-1?'<span class="oring">⚭'+(r.rl[i]?'<small>'+r.rl[i]+'</small>':'')+'</span>':'';

  }).join('');

}
function outlineParts(root,pdf){
  var rows=outlineRows(root),placed={};

function currentRoot(){var roots=treeRoots();return ui.treeRoot&&P(ui.treeRoot)?ui.treeRoot:(roots[0]?roots[0].id:data.people[0].id);}
/* In Hebrew mode the tree reads right to left: the whole layout is mirrored, so the oldest child
   and a first spouse on the left. */
function mirrorTree(L){
  var W=L.w,LW=1.5,swap={tl:'tr',tr:'tl',bl:'br',br:'bl'};
  L.items.forEach(function(it){
    if(it.t==='card') it.x=W-it.x-TW;
    else if(it.t==='ring'||it.t==='chip') it.x=W-it.x;
    else if(it.t==='h') it.x=W-it.x-it.w;
    else if(it.t==='v') it.x=W-it.x-LW;
    else if(it.t==='el'){it.x=W-it.x-it.w;it.c=swap[it.c];}
  });
  return L;
}
function treeMarkup(root,pdf){
  if(ui.treeLayout==='outline') return '<div class="ftree otree'+(ui.calMode==='heb'?' rtl':'')+'">'+outlineParts(root,pdf).join('')+'</div>';

  if(ui.calMode==='heb') mirrorTree(L);
  L.items.forEach(function(it){if(it.t==='card') placed[it.id]=1;});
  L.items.forEach(function(it){
    var y=it.y+TPAD;
    if(it.t==='h') h+='<i class="fl-h'+(it.cls?' '+it.cls:'')+'" style="left:'+it.x+'px;top:'+y+'px;width:'+it.w+'px"></i>';
    else if(it.t==='v') h+='<i class="fl-v'+(it.cls?' '+it.cls:'')+'" style="left:'+it.x+'px;top:'+y+'px;height:'+it.h+'px"></i>';
    else if(it.t==='el') h+='<i class="fl-el '+it.c+(it.cls?' '+it.cls:'')+'" style="left:'+it.x+'px;top:'+y+'px;width:'+Math.max(0,it.w)+'px;height:'+it.h+'px;'+{tl:'border-top-left-radius',tr:'border-top-right-radius',bl:'border-bottom-left-radius',br:'border-bottom-right-radius'}[it.c]+':'+it.r+'px"></i>';
  });
  L.items.forEach(function(it){
    var y=it.y+TPAD;
    if(it.t==='ring') h+='<span class="fring'+(it.ended?' ended':'')+'" style="left:'+it.x+'px;top:'+y+'px" title="'+esc(it.title)+'">⚭'+(it.label?'<small>'+it.label+'</small>':'')+'</span>';
    else if(it.t==='card') h+='<div class="fcell" style="left:'+it.x+'px;top:'+y+'px">'+tcard(P(it.id),it.id===root,placed,pdf)+'</div>';
    else if(it.t==='chip'&&!(pdf&&it.open)) h+='<button class="tchip'+(it.open?' open':'')+'" data-act="branch" data-k="'+esc(it.k)+'" style="left:'+it.x+'px;top:'+y+'px" title="'+(it.open?'Hide these children':'Show these children')+'">'+(it.open?'−':'+ '+it.n+(it.n===1?' child':' children'))+'</button>';

}

function syncDraft(){
  var f=$('#pform');if(!f||!drawer||!drawer.draft) return;
  var d=drawer.draft;
  $$('[data-f]',f).forEach(function(el){d[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;});
  var g=f.querySelector('input[name="f-gender"]:checked');d.gender=g?g.value:'';
  d.birth=$('#d-birth').value;d.birthSunset=$('#s-birth').checked;
  var de=$('#d-death');if(de){d.death=de.value;d.deathSunset=$('#s-death').checked;}
  d.father=$('#f-father').value;d.mother=$('#f-mother').value;
  d.marriages=$$('[data-mrow]',f).map(function(r){var i=r.dataset.mrow,old=d.marriages[+i]||{};return {id:old.id||null,spouse:$('#m-sp-'+i).value,date:$('#d-m'+i).value,sunset:$('#s-m'+i).checked,divorced:$('#m-dv-'+i).checked,nameHe:($('#m-nh-'+i)||{}).value||'',nameEn:($('#m-ne-'+i)||{}).value||''};});
  d.others=$$('[data-orow]',f).map(function(r){var i=r.dataset.orow;return {title:$('#o-t-'+i).value,date:$('#d-o'+i).value,sunset:$('#s-o'+i).checked};});
}
function applyDraft(){
  syncDraft();
  var d=drawer.draft;
  if(!d.first.trim()&&!d.last.trim()){drawer.err='Add at least a first or last name.';drawer.keepScroll=true;renderDrawer();return;}
  if(!d.gender){drawer.err='Choose male or female.';drawer.keepScroll=true;renderDrawer();return;}
  var isNew=!d.id,id=d.id||uid('p');
  var par=[d.father,d.mother].filter(function(x,i,a){return x&&x!==id&&a.indexOf(x)===i;});
  var p=normPerson({id:id,first:d.first.trim(),last:d.last.trim(),gender:d.gender,hebFirst:d.hebFirst.trim(),hebLast:d.hebLast.trim(),fatherHeb:d.father?'':d.fatherHeb.trim(),motherHeb:d.mother?'':d.motherHeb.trim(),birth:d.birth,birthSunset:d.birthSunset,birthNoYear:d.birthNoYear,hideAge:!!d.hideAge,deceased:d.deceased,death:d.deceased?d.death:'',deathSunset:d.deceased&&d.deathSunset,parents:par,others:d.others.filter(function(o){return o.date||o.title.trim();}).map(function(o){return {title:o.title.trim(),date:o.date,sunset:o.sunset};}),phone:d.phone.trim(),email:d.email.trim(),notes:d.notes});
  if(isNew) data.people.push(p);
  else data.people[data.people.findIndex(function(x){return x.id===id;})]=p;
  var keep={};
  d.marriages.forEach(function(m){
    var nh=(m.nameHe||'').trim(),ne=(m.nameEn||'').trim();
    if(m.spouse===id) return;
    if(!m.spouse&&!parseISO(m.date)&&!nh&&!ne) return;
    var ex=m.id&&data.marriages.find(function(x){return x.id===m.id;});
    var rec={id:ex?ex.id:uid('m'),a:id,b:m.spouse||'',date:parseISO(m.date)?m.date:'',sunset:!!m.sunset,divorced:!!m.divorced,nameHe:m.spouse?'':nh,nameEn:m.spouse?'':ne};
    if(ex) Object.assign(ex,rec); else data.marriages.push(rec);
    keep[rec.id]=1;
  });
  data.marriages=data.marriages.filter(function(m){return keep[m.id]||(m.a!==id&&m.b!==id);});
  if(isNew&&drawer.link&&(drawer.link.type==='father'||drawer.link.type==='mother')){
    var c=data.people.find(function(x){return x.id===drawer.link.of;});
    if(c&&c.parents.indexOf(id)<0){
      var cp=parentsOf(c),keepP=drawer.link.type==='father'?cp.mother:cp.father;
      c.parents=[drawer.link.type==='father'?id:(keepP?keepP.id:''),drawer.link.type==='mother'?id:(keepP?keepP.id:'')].filter(Boolean);
      if(drawer.link.type==='father') c.fatherHeb='';else c.motherHeb='';
    }
  }
  markDirty();
  drawer={mode:'view',pid:id};
  renderAll();
  toast(isNew?fullName(p)+' added — remember to save.':'Changes applied — remember to save.');
}
function deletePerson(id){
  data.people=data.people.filter(function(p){return p.id!==id;});
  data.people.forEach(function(p){p.parents=p.parents.filter(function(x){return x!==id;});});
  data.marriages=data.marriages.filter(function(m){return m.a!==id&&m.b!==id;});
  if(ui.treeRoot===id) ui.treeRoot=null;
  markDirty();drawer=null;renderAll();toast('Deleted — remember to save.');
}

function nameSegs(p,zl){

/* A couple in a small box: "שמואל ואסתר לוין" (or "Shmuel & Esther Levin" without Hebrew names). */
function coupleText(e){
  var ps=e.pids.map(P);

    var p=ps[0],sn=e.sn||'',full=/\s/.test(sn);
    if(p.hebFirst&&(!sn||/[֐-׿]/.test(sn))){var hl=p.hebLast?' '+p.hebLast:'';return full?p.hebFirst+hl+' ו'+sn:p.hebFirst+(sn?' ו'+sn:'')+hl;}

  }

function wallSegs(e){

function loadPdfLib(){return window.jspdf&&window.jspdf.jsPDF?Promise.resolve():loadScript(LIB_PDF);}
function makeWall(size){
  var dims=WALL_SIZES[size]||WALL_SIZES['24x36'];
  return loadPdfLib().then(function(){
    var por=ui.orient==='portrait',W=(por?dims[1]:dims[0])*72,Hh=(por?dims[0]:dims[1])*72,M=0.45*72,G=0.2*72;
    var pdf=new window.jspdf.jsPDF({orientation:por?'portrait':'landscape',unit:'pt',format:[W,Hh],compress:true});
    pdf.addFileToVFS('Alef-Regular.ttf',$('#font-alef-regular').textContent.trim());pdf.addFont('Alef-Regular.ttf','Alef','normal');
    pdf.addFileToVFS('Alef-Bold.ttf',$('#font-alef-bold').textContent.trim());pdf.addFont('Alef-Bold.ttf','Alef','bold');
    pdf.setProperties({title:data.meta.familyName+' — '+yearTitle().t,creator:'Family Luach'});
    var T=vecText(pdf),INK='#19222D',INK2='#46515E',INK3='#77818D',LINE='#D3D9D0';
    function fill(hex){var c=rgb(hex);pdf.setFillColor(c[0],c[1],c[2]);}
    function stroke(hex,w){var c=rgb(hex);pdf.setDrawColor(c[0],c[1],c[2]);pdf.setLineWidth(w);}
    var ms=yearMonths(),heb=ui.calMode==='heb',yt=yearTitle(),n=ms.length;
    var C=por?3:(n>12?5:4),R=Math.ceil(n/C),headH=Math.min(W,Hh)*0.07;
    var mW=(W-2*M-(C-1)*G)/C,mH=(Hh-2*M-headH-G-(R-1)*G)/R;
    var tH=Math.max(16,mH*0.08),wdH=Math.max(9,mH*0.042),dW=mW/7,dH=(mH-tH-wdH)/6;
    var fs=Math.max(6,Math.min(15,Math.min(dH/5.6,dW/9))),nfs=fs*1.2;
    var by={};
    eventsBetween(ms[0].a0,ms[ms.length-1].a1).filter(visible).forEach(function(e){(by[e.abs]=by[e.abs]||[]).push(e);});
    /* header */
    T.draw([{t:data.meta.familyName,b:true}],M,M+headH*0.5,headH*0.42,'left');
    T.draw([{t:yt.t+' · ',c:INK2,b:true},{t:yt.he,c:INK2,b:true},{t:' · '+yt.sub,c:INK2,b:true}],M,M+headH*0.86,headH*0.2,'left');
    var legend=[['birthday','Birthday'],['hbirthday','Hebrew birthday'],['anniversary','Anniversary'],['yahrzeit','Yahrzeit'],['other','Other date'],['holiday','Holiday']];
    var ls=fs*1.15,lx=W-M,ly=M+headH*0.45;
    legend.slice().reverse().forEach(function(k){
      var w=T.width([{t:k[1]}],ls);lx-=w;T.draw([{t:k[1],c:INK2}],lx,ly,ls,'left');
      lx-=ls*0.35+ls*0.9;fill(KHEX[k[0]]);pdf.rect(lx,ly-ls*0.8,ls*0.9,ls*0.9,'F');lx-=ls*1.6;
    });
    T.draw((heb?[]:[{t:'א',c:'#6A4899',b:true},{t:' = kept by the Hebrew date · ',c:INK3}]).concat([{t:'numbers are the age or year being marked · Printed '+fmtG(TODAY),c:INK3}]),W-M,M+headH*0.86,ls,'right');
    stroke(INK,2.2);pdf.line(M,M+headH,W-M,M+headH);
    /* months */
    var top=M+headH+G;
    ms.forEach(function(mo,mi){
      var x0=M+(mi%C)*(mW+G),y0=top+Math.floor(mi/C)*(mH+G),yd=y0+tH+wdH;
      fill(INK);pdf.rect(x0,y0,mW,tH,'F');
      T.draw([{t:mo.t,c:'#FFFFFF',b:true}],x0+tH*0.35,y0+tH*0.7,tH*0.58,'left');
      T.draw([{t:mo.he,c:'#D3D9D0',b:true}],x0+mW-tH*0.35,y0+tH*0.7,tH*0.5,'right');
      fill('#E7EBE5');pdf.rect(x0,y0+tH,mW,wdH,'F');
      WDS.forEach(function(w,i){T.draw([{t:i===6?'Shabbat':w,c:INK2,b:true}],x0+(i+0.5)*dW,y0+tH+wdH*0.72,wdH*0.58,'center');});
      var lead=dow(mo.a0),last=lead+(mo.a1-mo.a0);
      for(var c=0;c<42;c++){
        var cx=x0+(c%7)*dW,cy=yd+Math.floor(c/7)*dH;
        if(c<lead||c>last){fill('#FAFBF9');pdf.rect(cx,cy,dW,dH,'F');}
        else if(c%7===6){fill('#F4F6F3');pdf.rect(cx,cy,dW,dH,'F');}
      }
      stroke(LINE,0.6);
      for(var k=1;k<7;k++) pdf.line(x0+k*dW,yd,x0+k*dW,yd+6*dH);
      for(k=1;k<6;k++) pdf.line(x0,yd+k*dH,x0+mW,yd+k*dH);
      stroke(INK,1.1);pdf.rect(x0,y0,mW,mH,'S');
      for(var a=mo.a0;a<=mo.a1;a++){
        var ci=lead+(a-mo.a0),dx=x0+(ci%7)*dW,dy=yd+Math.floor(ci/7)*dH;
        var g=gFromAbs(a),hd=H.fromAbs(a);
        var main=heb?gem(hd.d):String(g.d);
        var small=heb?(g.d===1||a===mo.a0?GMS[g.m-1]+' '+g.d:String(g.d)):(hd.d===1?gem(1)+' '+hmName(hd.m,hd.y,true):gem(hd.d));
        T.draw([{t:main,b:true}],dx+3.5,dy+nfs*1.05,nfs,'left');
        T.draw([{t:small,c:INK3}],dx+dW-3.5,dy+nfs*1.05,fs*0.9,'right');
        var list=by[a]||[];if(!list.length) continue;
        var ey=dy+nfs*1.05+fs*0.55,avail=dy+dH-3-ey,innerW=dW-7-5;
        /* Names are never cut: each entry wraps onto as many lines as it needs, and a crowded day
           shrinks its text until everything fits; only past that does "+N more" appear. */

            if(e.kind==='holiday'){var hl=T.wrap(T.tokens([{t:e.title,c:'#3D7853',b:true}]),s,innerW+5);return {e:e,hol:true,lines:hl,h:hl.length*lh};}
            var ln=T.wrap(T.tokens(wallSegs(e)),s,innerW);return {e:e,lines:ln,h:ln.length*lh+2};
          });
          var tot=blocks.reduce(function(t,b){return t+b.h+2;},0);
          if(tot<=avail||last) plan={s:s,lh:lh,blocks:blocks};
        }
        var used=0,shown=[],hidden=0,moreH=plan.lh;
        plan.blocks.forEach(function(b,bi){
          var need=b.h+2,rest=plan.blocks.length-bi-1;
          if(!hidden&&used+need+(rest?0:0)<=avail&&(rest===0||used+need+moreH<=avail||plan.blocks.slice(bi+1).reduce(function(t,x){return t+x.h+2;},used+need)<=avail)){shown.push(b);used+=need;}

        var yy=ey;

          if(b.hol){T.drawLine(b.lines[0],dx+3.5,yy+plan.lh*0.82,plan.s,'left');yy+=b.h+2;return;}
          var key=kkey(b.e);
          fill(KTINT[key]);pdf.rect(dx+3.5,yy,dW-7,b.h,'F');
          fill(KHEX[key]);pdf.rect(dx+3.5,yy,2.4,b.h,'F');
          b.lines.forEach(function(line,li){T.drawLine(line,dx+3.5+5,yy+1+plan.lh*(li+0.8),plan.s,'left');});
          yy+=b.h+2;
        });
        if(hidden) T.draw([{t:'+'+hidden+' more',c:INK3}],dx+3.5+5,yy+plan.lh*0.8,plan.s*0.9,'left');
      }
    });
    var name=(data.meta.familyName+' - Wall calendar '+yt.t+' ('+dims[1]+'x'+dims[0]+' in'+(por?', portrait':'')+')').replace(/[\\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim()+'.pdf';
    return {blob:pdf.output('blob'),name:name,pages:1};
  });
}

    if(web.err) h+='<p class="err">'+esc(web.err)+'</p>';

  } else {
    h+='<h1>Family Luach</h1><p>This family calendar hasn’t been set up yet.</p><div><button class="btn sm" data-act="setup-open">Set it up (first editor)</button></div>';
  }

}

/* Files to the viewer: Claude's download prompt inside Claude, an ordinary download on the website. */
function saveFile(name,content,type){
  if(!WEB) return window.claude.use('downloads').then(function(dl){if(!dl) throw {code:'unavailable'};return dl.save({filename:name,data:content});});
  var blob=content instanceof Blob?content:new Blob([content],{type:type||'application/octet-stream'});
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},5000);
  return Promise.resolve({status:'saved'});
}
function exportData(){
  var d=new Date(),name='Family Luach backup '+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';
  saveFile(name,JSON.stringify({app:'family-luach',v:1,exported:d.toISOString(),data:data},null,1),'application/json')
    .then(function(){toast('Data file saved.');},function(e){toast(e&&e.code==='declined'?'Download cancelled.':'Couldn’t save the data file.');});
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result),d=j&&j.data&&j.data.people?j.data:j;
      if(!d||!Array.isArray(d.people)) throw new Error('not a data file');
      data=normalize(d);ui.treeRoot=null;drawer=null;markDirty();ui.panel=null;renderAll();
      toast('Imported '+data.people.length+' people — check them, then Save.');
    }catch(e){toast('That file isn’t a Family Luach data file.');}
  };
  r.readAsText(file);
}

/* ---------- Save / publish ---------- */
var PKEY='family-luach-pending';
function markDirty(){reindex();dirty=JSON.stringify(data)!==JSON.stringify(saved);try{if(dirty) sessionStorage.setItem(PKEY,JSON.stringify(data));else sessionStorage.removeItem(PKEY);}catch(e){}}
function restorePending(){
  try{
    var s=sessionStorage.getItem(PKEY);if(!s) return;
    var d=normalize(JSON.parse(s));
    if(JSON.stringify(d)===JSON.stringify(saved)){sessionStorage.removeItem(PKEY);return;}
    data=d;reindex();dirty=true;toast('Your unsaved changes were restored.');
  }catch(e){}
}
function buildHtml(d){
  var S='script';
  var json=JSON.stringify(d).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+PAGE_TITLE+'</title>\n'+ICON_LINKS+'\n'+FONT_LINKS+'\n<style id="app-style">'+$('#app-style').textContent+'</style>\n</head>\n<body>\n<div id="app"></div>\n<div id="drawer-root"></div>\n<'+S+' type="application/json" id="family-data">'+json+'</'+S+'>\n<'+S+' type="text/plain" id="font-alef-regular">'+$('#font-alef-regular').textContent+'</'+S+'>\n<'+S+' type="text/plain" id="font-alef-bold">'+$('#font-alef-bold').textContent+'</'+S+'>\n<'+S+' id="app-script">'+$('#app-script').textContent+'</'+S+'>\n</body>\n</html>\n';
}
function save(){
  if(WEB){if(!saving) webSave();return;}
  if(saving) return;
  if(!artNs){toast('Saving isn’t available in this view.');return;}
  saving=true;render();
  try{sessionStorage.setItem(PKEY,JSON.stringify(data));sessionStorage.setItem('fl-restore-view',ui.view);}catch(e){}
  artNs.publish(buildHtml(data)).then(function(){toast('Saved. Reloading…');},function(err){
    saving=false;
    var c=err&&err.code;
    if(c==='conflict'){toast('A newer version was saved elsewhere — reloading. Your edits will be kept.');return;}
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){canWrite=false;dirty=false;renderAll();toast('This page is view-only for you.');return;}
    if(c==='rate_limited'){render();toast('Saving too often — wait a moment and try again.');return;}
    if(c==='too_large'){render();toast('The family data is too large to save. Shorten some notes and try again.');return;}
    render();toast('Couldn’t save ('+(err&&err.message||'unknown error')+'). Try again.');
  });
}
function discard(){data=JSON.parse(JSON.stringify(saved));reindex();dirty=false;try{sessionStorage.removeItem(PKEY);}catch(e){}if(drawer&&drawer.pid&&!P(drawer.pid)) drawer=null;if(drawer&&drawer.mode==='edit') drawer=null;renderAll();toast('Changes discarded.');}

var toastTimer;

  var t=$('#fl-toast');
  if(!t){t=document.createElement('div');t.id='fl-toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},3200);
}
function renderAll(){render();renderDrawer();}

    case 'yday':ui.sel=+t.dataset.abs;gotoMonthOf(ui.sel);ui.calSpan='month';lsSet('fl-calspan','month');render();window.scrollTo(0,0);break;
    case 'open':openPerson(pid);break;
    case 'show-tree':ui.treeRoot=topAncestor(pid);ui.view='tree';lsSet('fl-view','tree');drawer=null;renderAll();window.scrollTo(0,0);break;

/* Tree: wheel / trackpad pinch zooms; drag on the background pans. */
document.addEventListener('wheel',function(e){
  var w=e.target.closest&&e.target.closest('#tree-wrap');if(!w) return;
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)));
},{passive:false});
/* Drag works from anywhere in the tree, cards included (a drag doesn't count as a tap on the card).
   Two fingers pinch to zoom around the point between them. */
var pan=null,pinch=null,touches={},dragged=false;
function tw0(e){return e.target.closest&&e.target.closest('#tree-wrap');}
document.addEventListener('pointerdown',function(e){
  var w=tw0(e);if(!w||(e.pointerType==='mouse'&&e.button!==0)) return;
  touches[e.pointerId]={x:e.clientX,y:e.clientY};dragged=false;
  var ids=Object.keys(touches);
  if(ids.length===2){
    var p1=touches[ids[0]],p2=touches[ids[1]];
    pinch={w:w,d:Math.hypot(p1.x-p2.x,p1.y-p2.y)||1};pan=null;
  } else if(ids.length===1){pan={w:w,x:e.clientX,y:e.clientY,l:w.scrollLeft,t:w.scrollTop,id:e.pointerId};}
});
document.addEventListener('pointermove',function(e){
  if(!touches[e.pointerId]) return;
  touches[e.pointerId]={x:e.clientX,y:e.clientY};
  if(pinch){
    var ids=Object.keys(touches);if(ids.length<2) return;
    var p1=touches[ids[0]],p2=touches[ids[1]],d=Math.hypot(p1.x-p2.x,p1.y-p2.y)||1;
    zoomAt((p1.x+p2.x)/2,(p1.y+p2.y)/2,d/pinch.d);pinch.d=d;dragged=true;return;
  }
  if(!pan||e.pointerId!==pan.id) return;
  var dx=e.clientX-pan.x,dy=e.clientY-pan.y;
  if(!dragged&&Math.abs(dx)+Math.abs(dy)<6) return;
  if(!dragged){dragged=true;ui.zoomFit=false;pan.w.classList.add('panning');}
  pan.w.scrollLeft=pan.l-dx;pan.w.scrollTop=pan.t-dy;
});
function endTouch(e){
  delete touches[e.pointerId];
  if(pinch&&Object.keys(touches).length<2){pinch=null;var ids=Object.keys(touches),w=$('#tree-wrap');if(ids.length===1&&w){var p=touches[ids[0]];pan={w:w,x:p.x,y:p.y,l:w.scrollLeft,t:w.scrollTop,id:+ids[0]};}}
  if(pan&&e.pointerId===pan.id){pan.w.classList.remove('panning');pan=null;}
}
document.addEventListener('pointerup',endTouch);
document.addEventListener('pointercancel',endTouch);
document.addEventListener('click',function(e){if(dragged&&tw0(e)){e.stopPropagation();e.preventDefault();dragged=false;}},true);
/* Phones fire "resize" when the address bar slides in and out: only refit when the width really changes. */
var lastW=window.innerWidth;
window.addEventListener('resize',function(){
  if(ui.view!=='tree') return;
  if(window.innerWidth===lastW){var z=ui.zoomFit;ui.zoomFit=false;sizeTree();ui.zoomFit=z;return;}
  lastW=window.innerWidth;sizeTree();

document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='login') signIn();if(e.target.id==='setup') runSetup();});
/* Root the tree at the oldest known ancestor, going through a spouse for in-laws with no parents listed. */
function topAncestor(id){
  function hasPar(x){var p=P(x);return p&&p.parents.some(function(q){return P(q);});}
  var start=id;
  if(!hasPar(id)){var s=spousesOf(id).filter(function(x){return hasPar(x.pid);})[0];if(s) start=s.pid;}
  var cur=start,guard=0;
  while(guard++<30&&hasPar(cur)) cur=P(cur).parents.filter(function(q){return P(q);})[0];
  return cur;
}

try{var rv=sessionStorage.getItem('fl-restore-view');if(rv){ui.view=rv;sessionStorage.removeItem('fl-restore-view');}}catch(e){}

    if(!ns) return;
    artNs=ns;
    return window.claude.use('user').then(function(u){return u?u.canEdit():null;},function(){return null;}).then(function(ok){
      if(ok===false) return;
      canWrite=true;restorePending();renderAll();
    });
  },function(){});
})();
})();
